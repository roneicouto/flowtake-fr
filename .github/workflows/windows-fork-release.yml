name: Windows fork build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a Windows prerelease after all checks pass (main only)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: windows-fork-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Windows x64
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies from lockfile
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Run Node tests
        run: npm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Run Rust unit tests (including recording diagnostics)
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --lib

      - name: Run Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings --allow dead_code

      - name: Build Windows installers
        run: npm run build -- --bundles nsis,msi

      - name: Identify the exact built commit and version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid package version' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "commit=$(git rev-parse HEAD)" >> $env:GITHUB_OUTPUT

      - name: Collect installers, portable app and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          $msi = @(Get-ChildItem src-tauri/target/release/bundle/msi/*.msi)
          if ($nsis.Count -eq 0 -or $msi.Count -eq 0) { throw 'Missing required Windows installer' }
          New-Item -ItemType Directory installers | Out-Null
          $nsis + $msi | Copy-Item -Destination installers
          New-Item -ItemType Directory portable/Flowtake -Force | Out-Null
          Copy-Item src-tauri/target/release/flowtake.exe portable/Flowtake/Flowtake.exe
          Copy-Item src-tauri/resources/THIRD_PARTY_NOTICES.txt portable/Flowtake/
          Compress-Archive -Path portable/Flowtake -DestinationPath installers/Flowtake-windows-x64-portable.zip
          git rev-parse HEAD | Set-Content installers/COMMIT.txt
          $sums = Get-ChildItem installers -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $sums | Set-Content installers/SHA256SUMS.txt

      - name: Upload tested Windows build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-fork-${{ github.run_id }}-${{ github.run_attempt }}
          path: installers/*
          if-no-files-found: error

  publish:
    name: Publish Windows prerelease
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && inputs.publish))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-fork-${{ github.run_id }}-${{ github.run_attempt }}
          path: installers

      - name: Verify artifacts and create release for the tested commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILT_COMMIT: ${{ needs.build.outputs.commit }}
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd installers
          sha256sum --check SHA256SUMS.txt
          test "$(tr -d '\r\n' < COMMIT.txt)" = "$BUILT_COMMIT"
          tag="windows-v${APP_VERSION}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          cat > "$RUNNER_TEMP/windows-release.md" <<EOF
          Build Windows do fork ${GH_REPO}.

          Commit compilado e testado: ${BUILT_COMMIT}
          Execução: https://github.com/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}

          Baixe o instalador .exe (NSIS), .msi ou o ZIP portátil.
          FFmpeg deve estar instalado separadamente. Esta build não inclui FFmpeg.
          Os instaladores não têm assinatura de código do Windows.

          Os testes de CI não validam a captura na GPU física nem a prévia do editor.
          EOF
          gh release create "$tag" ./* --repo "$GH_REPO" --target "$BUILT_COMMIT" \
            --title "Flowtake Windows ${APP_VERSION} — build ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --prerelease --notes-file "$RUNNER_TEMP/windows-release.md"
